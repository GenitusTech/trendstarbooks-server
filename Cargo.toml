[package]
name = "trendstarbooks"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

# Standard metadata that helps with security maintenance
authors = ["GJM <contact@genitus.tech>"]
description = "Server Web API for TrendStarBooks coded in RUST"
license = "Apache-2.0"
repository = "https://github.com/GenitusTech/trendstarbooks-server"
readme = "README.md"

[profile.dev]
opt-level = 0      # No optimizations for faster compile times
debug = true       # Include debug info
incremental = true # Faster incremental compilation

[profile.release]
opt-level = "z"   # Optimize for size (reduces attack surface)
lto = "fat"       # Aggressive link-time optimizations
codegen-units = 1 # Better optimization (slower compile)
panic = "abort"   # No unwinding (smaller binary, fewer exploits)
strip = "symbols" # Remove debug symbols in release
debug = false     # No debug info in production

[dependencies]
actix-cors = "0.7.1"
actix-csrf = "0.8.0"
actix-files = "0.6.6"
actix-identity = "0.8.0"
actix-web = { version = "4.11.0", features = ["openssl"] }
config = "0.15.11"
governor = "0.10.0"
openssl = { version = "0.10.73", features = ["vendored"] }
rand = "0.9.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
zeroize = "1.8.1"

[dev-dependencies]
cargo-audit = "0.21.2"
cargo-crev = "0.26.4"
cargo-deny = "0.18.3"
cargo-geiger = "0.12.0"
clippy = "0.0.302"

[workspace]

[features]

debug = []
